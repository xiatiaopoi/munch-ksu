# 让 munch 内核里的 BakaSU（Baka-SU/BakaSU）保持更新：
#   1. 定时检查上游 main 最新提交；
#   2. 与 build.sh 里固定的 BAKASU_COMMIT 不同才真正编译（省 CI 时间）；
#   3. MIUI / AOSP 两个变体都编集成 BakaSU 的版本；
#   4. 全部编译成功后才发布 Release，并把 build.sh 的 BAKASU_COMMIT 更新为这次编译的提交；
#   5. .github/bakasu-blockers 登记本内核树暂时跟不上的上游提交，命中就跳过并说明原因。
name: bakasu-sync

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: '指定 BakaSU 提交/分支（留空 = 上游 main 最新）'
        required: false
        default: ''
      force:
        description: '和当前固定值相同也强制编译'
        type: boolean
        default: false
      variant:
        description: '编译哪个变体（both = MIUI + AOSP）'
        type: choice
        options:
          - both
          - miui
          - aosp
        default: both
      update_pin:
        description: '编译成功后发布 Release 并更新 build.sh 的 BAKASU_COMMIT'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bakasu-sync
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream BakaSU
    runs-on: ubuntu-24.04
    outputs:
      head: ${{ steps.ref.outputs.head }}
      pinned: ${{ steps.ref.outputs.pinned }}
      target: ${{ steps.ref.outputs.target }}
      need_build: ${{ steps.ref.outputs.need_build }}
      blocked: ${{ steps.ref.outputs.blocked }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve BakaSU head, pinned commit and build target
        id: ref
        run: |
          REPO=https://github.com/Baka-SU/BakaSU.git
          HEAD_SHA=$(git ls-remote "$REPO" refs/heads/main | cut -f1)
          PINNED=$(grep 'BAKASU_COMMIT' build.sh | grep -oE '[0-9a-f]{40}' | head -n1)
          REF="${{ github.event.inputs.ref }}"
          if [ -z "$HEAD_SHA" ] || [ -z "$PINNED" ]; then
            echo "无法解析 BakaSU 上游或本地固定提交 (head='$HEAD_SHA' pinned='$PINNED')" >&2
            exit 1
          fi

          if [ -z "$REF" ]; then
            TARGET="$HEAD_SHA"
          else
            case "$REF" in
              *[!0-9a-f]*) TARGET=$(git ls-remote "$REPO" "$REF" "refs/heads/$REF" "refs/tags/$REF^{}" "refs/tags/$REF" | head -n1 | cut -f1) ;;
              *) TARGET="$REF" ;;
            esac
            if [ -z "$TARGET" ]; then
              echo "无法解析指定的 BakaSU ref: $REF" >&2
              exit 1
            fi
          fi

          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

          BLOCKED=""
          if [ "$TARGET" = "$HEAD_SHA" ] && [ "${{ github.event.inputs.force }}" != "true" ] && [ -f .github/bakasu-blockers ]; then
            while IFS='|' read -r BSHA BNOTE; do
              case "$BSHA" in ''|'#'*) continue ;; esac
              STATUS=$(curl -s -m 30 "https://api.github.com/repos/Baka-SU/BakaSU/compare/$BSHA...$HEAD_SHA" | grep -o '"status": *"[a-z]*"' | head -n1 | sed 's/.*"\([a-z]*\)"$/\1/')
              if [ "$STATUS" = "ahead" ] || [ "$STATUS" = "identical" ]; then
                BLOCKED="$BNOTE"
                break
              fi
            done < .github/bakasu-blockers
          fi

          {
            echo "### BakaSU 版本检查"
            echo ""
            echo "- 上游 main: \`$HEAD_SHA\`"
            echo "- build.sh 固定: \`$PINNED\`"
            echo "- 本次目标: \`$TARGET\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$BLOCKED" ]; then
            echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"
            echo "need_build=false" >> "$GITHUB_OUTPUT"
            echo "- 跳过编译: $BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "blocked=" >> "$GITHUB_OUTPUT"
            if [ "$TARGET" != "$PINNED" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "need_build=true" >> "$GITHUB_OUTPUT"
              echo "- 需要编译: 是" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "need_build=false" >> "$GITHUB_OUTPUT"
              echo "- 需要编译: 否（已是最新）" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  build:
    name: Build munch | ${{ matrix.variant }} | BakaSU
    needs: check
    if: needs.check.outputs.need_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ (github.event.inputs.variant == 'miui' && fromJSON('["miui"]')) || (github.event.inputs.variant == 'aosp' && fromJSON('["aosp"]')) || fromJSON('["miui","aosp"]') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf libncurses-dev \
            lib32readline-dev lib32z1-dev lz4 \
            libsdl1.2-dev libssl-dev libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          key: ${{ runner.os }}-kernel-ccache-munch-${{ matrix.variant }}-bakasu-${{ needs.check.outputs.target }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-munch-${{ matrix.variant }}-
            ${{ runner.os }}-kernel-ccache-munch-
            ${{ runner.os }}-kernel-ccache-

      - name: Setup proton-clang Toolchain
        run: |
          TC="$HOME/proton-clang/proton-clang-20210522/bin"
          mkdir -p "$TC"
          cd "$TC"
          ln -sf "$(command -v clang)" clang
          ln -sf "$(command -v ld.lld)" ld.lld
          for p in aarch64-linux-gnu arm-linux-gnueabi; do
            for t in ld as ar nm objcopy objdump strip readelf gcc g++ cpp; do
              if command -v $p-$t >/dev/null; then
                ln -sf "$(command -v $p-$t)" "$p-$t"
              fi
            done
          done
          sudo ln -sf "$(command -v ccache)" /usr/lib/ccache/clang

      - name: Run Build Script (BakaSU ${{ needs.check.outputs.target }})
        env:
          BAKASU_COMMIT: ${{ needs.check.outputs.target }}
        run: |
          chmod +x build.sh
          echo "使用 BakaSU 提交: $BAKASU_COMMIT"
          ./build.sh munch ksu ${{ matrix.variant }}

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-munch-${{ matrix.variant }}-BakaSU-${{ needs.check.outputs.target }}-${{ github.run_id }}
          path: "*.zip"
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Release + update BAKASU_COMMIT
    needs: [check, build]
    if: needs.check.outputs.need_build == 'true' && (github.event.inputs.update_pin == 'true' || github.event.inputs.update_pin == true || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_kernels
          pattern: Kernel-*-${{ github.run_id }}
          merge-multiple: true

      - name: Generate Release Info
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "SHORT=$(echo '${{ needs.check.outputs.target }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "TAG=bakasu-$(date +'%Y%m%d')-$(echo '${{ needs.check.outputs.target }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"
          ls -l all_kernels

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: "munch BakaSU ${{ steps.vars.outputs.BUILD_DATE }} (${{ steps.vars.outputs.SHORT }})"
          body: |
            ## munch 内核（集成 BakaSU）/ Automated BakaSU Kernel Release

            - **BakaSU 提交 / BakaSU commit:** `${{ needs.check.outputs.target }}`
            - **当时上游 main / upstream head:** `${{ needs.check.outputs.head }}`
            - **构建日期 / Build date:** ${{ steps.vars.outputs.BUILD_DATE }}
            - **设备 / Device:** `munch`（Redmi K40S / POCO F4）
            - **上游提交 / Upstream commit:** https://github.com/Baka-SU/BakaSU/commit/${{ needs.check.outputs.target }}

            ### 刷机包列表 / ZIPs
            - **MIUI 变体**：MIUI / HyperOS 专用（含 MIUI 面板与刷新率调整）
            - **AOSP 变体**：第三方 AOSP ROM 专用（MIUI 机器刷入会黑屏）
            - 两个变体都已集成 BakaSU + SUSFS。
          files: all_kernels/*.zip

      - name: Bump BAKASU_COMMIT in build.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PINNED="${{ needs.check.outputs.pinned }}"
          TARGET="${{ needs.check.outputs.target }}"
          if [ "$PINNED" = "$TARGET" ]; then
            echo "build.sh 已是 $TARGET，无需改动"
            exit 0
          fi
          sed -i "s/$PINNED/$TARGET/" build.sh
          grep 'BAKASU_COMMIT' build.sh
          git config user.name "bakasu-sync[bot]"
          git config user.email "bakasu-sync@users.noreply.github.com"
          git add build.sh
          git commit -m "chore(bakasu): bump BAKASU_COMMIT to $(echo "$TARGET" | cut -c1-8) [skip ci]"
          if git push origin "HEAD:${{ github.ref_name }}"; then
            echo "已通过 git push 更新固定值"
            exit 0
          fi
          echo "git push 失败，回退到 Contents API 更新" >&2
          git checkout -- build.sh || true
          python3 - "$PINNED" "$TARGET" <<'PY'
          import base64, json, os, sys, urllib.error, urllib.request
          pinned, target = sys.argv[1], sys.argv[2]
          repo, branch = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_REF_NAME']
          api = f"https://api.github.com/repos/{repo}/contents/build.sh"
          hdr = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          data = json.load(urllib.request.urlopen(urllib.request.Request(f"{api}?ref={branch}", headers=hdr)))
          text = base64.b64decode(data['content']).decode()
          if pinned not in text:
              sys.exit(f"build.sh 里找不到 {pinned}")
          body = json.dumps({
              "message": f"chore(bakasu): bump BAKASU_COMMIT to {target[:8]} [skip ci]",
              "content": base64.b64encode(text.replace(pinned, target, 1).encode()).decode(),
              "branch": branch,
              "sha": data['sha'],
          }).encode()
          req = urllib.request.Request(api, data=body, method='PUT',
                                       headers={**hdr, "Content-Type": "application/json"})
          try:
              resp = json.load(urllib.request.urlopen(req))
              print("API 更新成功:", resp['content']['sha'])
          except urllib.error.HTTPError as e:
              print(e.read().decode()[:800])
              raise
          PY

      - name: Summary
        run: |
          {
            echo "### 结果"
            echo ""
            echo "- BakaSU 目标: \`${{ needs.check.outputs.target }}\`"
            echo "- 之前固定: \`${{ needs.check.outputs.pinned }}\`"
            echo "- 上游 main: \`${{ needs.check.outputs.head }}\`"
            echo "- Release: ${{ steps.vars.outputs.TAG }}"
          } >> "$GITHUB_STEP_SUMMARY"
